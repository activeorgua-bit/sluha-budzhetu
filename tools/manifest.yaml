  - id: calib_politician
    batch: calibration
    template: chars_4x2_256
    aspect_ratio: horizontal_2_1
    references: [crops/politician_idle.png, crops/politician_walk1.png, crops/politician_walk2.png, crops/politician_jump.png, crops/palette_strip.png]
    prompt: >-
      Sprite sheet of the SAME character as the reference images (reference 2-5 show him), redrawn
      pixel-for-pixel in the same style. *politician* Cells row-major: 1 idle standing facing right,
      2 walk frame A (left leg forward), 3 walk frame B (right leg forward), 4 jump with one fist raised,
      5 idle standing, 6 walk frame A, 7 walk frame B, 8 jump. Feet on the baseline tick of every cell,
      same size in every cell (the character fills about 85% of the cell height).
    post: {kind: sheet, atlas: chars, frame_h: 56, names: [politician_idle_c, politician_walk1_c, politician_walk2_c, politician_jump_c, politician_idle_c2, politician_walk1_c2, politician_walk2_c2, politician_jump_c2]}

