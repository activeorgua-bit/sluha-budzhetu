  - id: l12_tiles
    batch: V2
    template: tiles_8x8_128
    resolution: 2k
    references: [mockup_level_1-3_bridge.png, crops/rect_tiles.png, crops/palette_strip.png]
    prompt: bridge-level tileset (dark stone piers with riveted steel slab tops, orange sandstone pier, rusty truss towers, gratings)
    post:
      kind: tiles
      world: b1
      fixup: fix_b1_water   # foam-only water: the river is painted by the parallax layer
      size: 48
      degrid: [scaffold_top_l, scaffold_top_r, scaffold_fill_l, scaffold_fill_r, rebar_plat_l, rebar_plat_r,
               truss_plat_l, truss_plat_m, truss_plat_r, ladder_top, ladder_mid]
      align_top: [truss_plat_l, truss_plat_m, truss_plat_r, rebar_plat_l, rebar_plat_r]
      # v002 cell map (the model drew 3-piece truss walkways and 2 X-frame cells; row 4 right = tan floor)
      cells: {pier_tl: 0, pier_t: 1, pier_t2: 2, pier_tr: 3, pier_l: 4, pier_c: 5, pier_c2: 6, pier_r: 7,
              pier_bl: 8, pier_b: 9, pier_br: 10, pier_c3: 11, pier_c4: 12, pier_deep: 13, ladder_top: 14, ladder_mid: 15,
              sand_tl: 16, sand_t: 17, sand_t2: 18, sand_tr: 19, sand_l: 20, sand_c: 21, sand_c2: 22, sand_r: 23,
              sand_bl: 24, sand_b: 25, sand_br: 26, floor_tl: 27, floor_t: 28, floor_t2: 29, floor_c: 30, floor_tr: 31,
              scaffold_top_l: 32, scaffold_top_r: 33, scaffold_fill_l: 32, scaffold_fill_r: 33,
              rebar_plat_l: 34, rebar_plat_r: 35, truss_plat_l: 37, truss_plat_m: 38, truss_plat_r: 39,
              metal_block: 40, crate: 41, brick_block: 42, hazard_barrier: 43, concrete_block: 44}
