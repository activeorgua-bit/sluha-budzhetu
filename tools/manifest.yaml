# Every generated asset of the game. Run:  python tools/generate_assets.py --batch <name> [--dry-run]
# References are relative to assets_src/reference/. The grid template named in `template` is always
# sent as the first reference. {palette} expands to the canonical hex list, {style} to style_suffix.
#
# Batches: calibration -> A (characters) -> C (tilesets) -> B (props) -> D (parallax) -> E (story)

defaults:
  model: gpt-image-2-edit
  quality: high
  resolution: 1k
  num_images: 2
  background: opaque
  moderation: low
  aspect_ratio: square_1_1

style_suffix: >-
  STYLE LOCK: 16-bit retro platformer pixel art exactly like the reference sprites: crisp square pixels
  (each art pixel is a clean 4x4 block at this size), no anti-aliasing, no blur, no gradients, 1-pixel
  dark outline around every shape, flat cel shading with 2-3 tones per colour and light from the top-left,
  chibi proportions (big head, short body). No text, no letters, no labels, no captions, no watermark,
  no drop shadows, no ground plane, no background scenery.

# ---------------------------------------------------------------------------------------------
# Character prompts share these design sheets so every pose describes the same person.
designs:
  politician: &politician >-
    THE POLITICIAN (the player): chubby middle-aged man, brown side-parted hair, thick dark eyebrows,
    smug half-smile, small eyes, dark navy suit jacket, white shirt, red tie, dark trousers, black shoes.
  journalist: &journalist >-
    THE JOURNALIST: slim man with black rectangular glasses, messy dark hair, black jacket with a white
    PRESS badge on the chest (a plain white rectangle, no readable letters), dark trousers, brown shoes.
  detective: &detective >-
    THE NABU DETECTIVE: man in a tan trench coat with a belt, brown fedora hat, white shirt, dark tie,
    dark trousers, brown shoes, serious face, carrying a small blue magnifying glass.
  cop: &cop >-
    THE PATROL OFFICER: stocky man in a dark navy police uniform with light-blue reflective bands on the
    chest and sleeves, black peaked cap with a small gold badge, black boots, friendly round face.
  babusya: &babusya >-
    THE GRANDMOTHER VOTER: short elderly woman, floral red-and-white headscarf, grey wool coat, long dark
    skirt, brown boots, round glasses, holding a glass jar of pickles.
  tracksuit: &tracksuit >-
    THE COURTYARD GUY: young man in a black tracksuit with three white stripes down the sleeves and legs
    (no logo), black flat cap, white sneakers, squatting posture, holding a small paper cone of seeds.
  oligarch: &oligarch >-
    THE OLIGARCH GUEST: heavy man in a white suit with a gold chain, black sunglasses, slicked black hair,
    holding a champagne glass, big grin.
  guard: &guard >-
    THE BORDER GUARD: tall man in an olive-green uniform with a peaked green cap, shoulder patches,
    black belt, dark trousers, holding a passport stamp.

assets:
