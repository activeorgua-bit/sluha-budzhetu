  - name: pipe_green
    colors: ['#0E4A1A', '#1A7A2C', '#2FB043', '#6FE07A', '#C4F7B8']
  - name: park_green
    colors: ['#173D1C', '#2A5E27', '#3F8A33', '#63B043', '#9ED65B']
