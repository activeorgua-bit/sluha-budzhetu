# Palette v2 for «Слуга Бюджету» — bright, saturated ramps like the level mockups.
#
# Authored ramps cover materials the reference sheets never show (university red, tulips, park
# greens, pipe green, pavers). `make_palette.py` then adds colours sampled from the two level
# mockups with k-means, drops near-duplicates, and draws the strip sent with every prompt.
#
#   python tools/make_palette.py

groups:
  - name: neutral
    colors: ['#000000', '#16131C', '#FFFFFF', '#F4EFE6']
  - name: sky
    colors: ['#2E7FD0', '#4A9BE0', '#6FB6EC', '#A4D4F5', '#D6EEFB']
  - name: cloud
    colors: ['#FFFFFF', '#E3EEF6', '#B9CCDC']
  - name: suit_navy
    colors: ['#1A2440', '#263559', '#3A4F7E', '#5A73A3']
  - name: shirt
    colors: ['#FFFFFF', '#E6E8EE', '#BFC4CF']
  - name: tie_red
    colors: ['#7E1413', '#B81F1C', '#E23A2E', '#F4745E']
  - name: skin
    colors: ['#FCD7B0', '#F1B887', '#D28A58', '#9E5A31', '#6B3A1E']
  - name: hair_brown
    colors: ['#3A2213', '#5E3A1E', '#8A5A2E', '#B8834A']
  - name: coat_tan
    colors: ['#5C4020', '#8A6634', '#B48E52', '#D8B77A']
  - name: gold
    colors: ['#8C5A0C', '#C98A14', '#F0B82A', '#FFE27A', '#FFF4C2']
  - name: money_green
