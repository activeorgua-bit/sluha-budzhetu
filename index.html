<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Слуга Бюджету — Servant of the Budget</title>
  <style>
    @font-face {
      font-family: 'PressStart2P';
      src: url('/assets/fonts/PressStart2P.ttf') format('truetype');
      font-display: block;
    }
    html, body { margin: 0; padding: 0; background: #0b0d12; height: 100%; overflow: hidden; }
    #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Font pre-warm so Phaser text measures correctly on first draw */
    #font-warm { position: absolute; left: -9999px; top: -9999px; font-family: 'PressStart2P'; }
  </style>
</head>
<body>
  <div id="game"></div>
  <span id="font-warm">Слуга Бюджету 0123456789 SCORE</span>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
